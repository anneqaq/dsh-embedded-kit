# dsh-embedded-kit bundle patch —— 对 profile 根插一行。
#
# 行 id 是配置树里的稳定标识：后加载的层（用户自己的 profile cordis.patch.yml、
# $DSH_HOME/cordis.patch.yml、--patch 覆盖层）可以按 id 覆盖该行，
# 覆盖是替换整个 `config`（不做深合并）。
#
# 注意 `name` 写的是**包名**而不是绝对路径 —— 这样通过
#   dsh plugin --profile <profile> add dsh-embedded-kit
# 装进 profile 之后即可解析，用户不必手写路径。
#
# 若只是在本地开发、直接挂源码目录（没装进 profile），请改用绝对路径形式：
#   - insert:
#       - id: dsh-embedded-kit
#         name: D:/AiLearn/my-DSH/plugins/dsh-embedded-kit/lib/index.js

- insert:
    - id: dsh-embedded-kit
      name: 'dsh-embedded-kit'
      config:
        # 会话启动门禁：每个会话首步注入一次，提示"哪些数字必须用工具算"。
        gateEnabled: true
        # 是否注册随包技能。拿不到技能服务时本插件只记日志、工具照常可用。
        registerSkills: true
        # Keil 后端用；其他构建后端与此无关。留空则依次尝试环境变量 KEIL_UV4 与默认路径。
        # uv4Path: C:\\Keil_v5\\UV4\\UV4.exe
